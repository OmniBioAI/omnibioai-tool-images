[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibioai-tool-images"
version = "0.1.6"
description = "OmniBioAI Tool Image Service: automated building, pushing, and versioning of Docker/Singularity images for bioinformatics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Manish Kumar" }]
keywords = ["docker", "singularity", "hpc", "bioinformatics", "containers", "devops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
]

dependencies = [
  "docker>=7.0.0",
  "pydantic>=2.6",
  "PyYAML>=6.0.1",
  "rich>=13.0",
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/man4ish/omnibioai-tool-images"
Repository = "https://github.com/man4ish/omnibioai-tool-images"

[tool.setuptools]
package-dir = { "" = "." }
packages = ["scripts"]

# -----------------------------
# COVERAGE CONFIG
#
# pytest.ini is the single source of truth for pytest/coverage invocation
# (pytest resolves config files in order pytest.ini > pyproject.toml >
# tox.ini > setup.cfg and stops at the first match, so a
# [tool.pytest.ini_options] table here would be silently ignored while
# pytest.ini exists -- it previously was, which is why the CI gate only
# ever measured api/ via tests/test_api_server_units.py instead of the
# full suite against api/+scripts/). coverage.py's own config lookup is
# independent of that and still reads [tool.coverage.*] below.
# -----------------------------
[tool.coverage.run]
source = ["api", "scripts"]
omit = [
    "tests/*",
    "dockerfiles/*",
    "sif/*",
]

[tool.coverage.report]
# Keep every configured coverage run above the repository quality gate.
fail_under = 98
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
