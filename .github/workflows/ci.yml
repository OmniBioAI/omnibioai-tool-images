name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-test.txt

      # The API service's dependencies match the service Dockerfile
      # (uvicorn, fastapi, sse-starlette); the package supplies the rest.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt pytest-cov -e . \
            uvicorn fastapi sse-starlette

      # pytest.ini runs the full tests/ suite and enforces 98% combined
      # coverage of api/+scripts/. Tests that need the workstation's
      # mounted SIF store skip with an explicit reason.
      - name: Full test suite (api+scripts coverage gate)
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 30
