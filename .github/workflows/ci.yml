name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      # Keep both repositories as siblings. Runtime resolution deliberately
      # looks beside the Tool Images checkout, matching local development and
      # release-build layout rather than relying on a CI-only override.
      - uses: actions/checkout@v4
        with:
          path: omnibioai-tool-images

      - name: Check out pinned private Tool Runtime
        uses: actions/checkout@v4
        with:
          repository: OmniBioAI/omnibioai-tool-runtime
          ref: 34a80219335f5dbeedeb7f0e6a4439913d12e25f
          path: omnibioai-tool-runtime
          token: ${{ secrets.TOOL_RUNTIME_REPO_TOKEN }}

      - name: Verify the Tool Runtime pin
        working-directory: omnibioai-tool-runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "34a80219335f5dbeedeb7f0e6a4439913d12e25f"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            omnibioai-tool-images/pyproject.toml
            omnibioai-tool-images/requirements-test.txt

      # The API service's dependencies match the service Dockerfile
      # (uvicorn, fastapi, sse-starlette); the package supplies the rest.
      - name: Install dependencies
        working-directory: omnibioai-tool-images
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt pytest-cov -e . \
            uvicorn fastapi sse-starlette

      # pytest.ini runs the full tests/ suite and enforces 98% combined
      # coverage of api/+scripts/. Tests that need the workstation's
      # mounted SIF store skip with an explicit reason.
      - name: Full test suite (api+scripts coverage gate)
        working-directory: omnibioai-tool-images
        run: pytest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: omnibioai-tool-images/coverage.xml
          if-no-files-found: error
          retention-days: 30
