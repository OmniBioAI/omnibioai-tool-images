name: Bedtools immutable SIF publication canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omnibioai-bedtools-immutable-canary
  cancel-in-progress: false

jobs:
  build-verify-publish-retrieve:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - tool: bedtools
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - tool: bedtools
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PILOT_TOOL: bedtools
      PILOT_ARCH: ${{ matrix.arch }}
      PILOT_PLATFORM: ${{ matrix.platform }}
      PILOT_DOCKERFILE: dockerfiles/Dockerfile.bedtools
      PILOT_SOURCE_COMMIT: ${{ github.sha }}
      PILOT_RUNNER: ${{ matrix.runner }}
      PILOT_PACKAGE_NAME: bedtools
    steps:
      - uses: actions/checkout@v4

      - name: Validate native runner before installing or building
        env:
          PILOT_RUNNER_OS: ${{ runner.os }}
          PILOT_RUNNER_ARCH: ${{ runner.arch }}
        run: python3 -m scripts.pilot_runner --output canary-output --runner-only

      - name: Checkout pinned tool runtime
        uses: actions/checkout@v4
        with:
          repository: OmniBioAI/omnibioai-tool-runtime
          ref: a4f3da56c2e6e9fd85e54ba009f6f3456de3b5b5
          path: omnibioai-tool-runtime

      - uses: docker/setup-buildx-action@v3

      - name: Install native Apptainer and ORAS
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer file
          oras_version=1.3.0
          case "${{ matrix.arch }}" in
            amd64)
              oras_arch=amd64
              oras_sha256=6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64
              ;;
            arm64)
              oras_arch=arm64
              oras_sha256=7649738b48fde10542bcc8b0e9b460ba83936c75fb5be01ee6d4443764a14352
              ;;
            *) exit 1 ;;
          esac
          archive="oras_${oras_version}_linux_${oras_arch}.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/oras-project/oras/releases/download/v${oras_version}/${archive}" \
            --output "/tmp/${archive}"
          printf '%s  %s\n' "$oras_sha256" "/tmp/${archive}" | sha256sum --check --strict
          tar -xzf "/tmp/${archive}" -C /tmp oras
          sudo install -m 0755 /tmp/oras /usr/local/bin/oras
          apptainer --version
          oras version

      - name: Resolve and bind the immutable base-image identity
        run: |
          set -euo pipefail
          python3 -m scripts.base_image_identity \
            --base-ref docker.io/library/python:3.11-slim-bookworm

      - name: Build and validate OCI and SIF without registry writes
        env:
          PILOT_RUNNER_OS: ${{ runner.os }}
          PILOT_RUNNER_ARCH: ${{ runner.arch }}
        run: python3 -m scripts.pilot_runner --output canary-output

      - name: Create actual candidate identity from validated evidence
        run: |
          set -euo pipefail
          python3 -m scripts.bedtools_canary prepare \
            --provenance canary-output/provenance.json \
            --sif "canary-output/bedtools_${{ matrix.arch }}.sif" \
            --output canary-output/candidate.json

      - name: Authenticate to the fixed Bedtools GHCR package
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Read-only immediate pre-publication decision
        run: python3 -m scripts.bedtools_canary decide --candidate canary-output/candidate.json --output canary-output/pre-publication.json

      - name: Publish only a PUBLISH_NEW immutable Bedtools candidate
        run: |
          set -euo pipefail
          python3 -m scripts.bedtools_canary publish \
            --candidate canary-output/candidate.json \
            --sif "canary-output/bedtools_${{ matrix.arch }}.sif" \
            --output canary-output/publication.json

      - name: Retrieve and verify exact identity and idempotency
        run: |
          set -euo pipefail
          python3 -m scripts.bedtools_canary retrieve \
            --candidate canary-output/candidate.json \
            --destination "canary-output/retrieved-bedtools-${{ matrix.arch }}.sif" \
            --output canary-output/retrieval.json

      - name: Execute and scientifically verify the retrieved SIF
        run: |
          set -euo pipefail
          python3 -m scripts.bedtools_canary runtime \
            --candidate canary-output/candidate.json \
            --sif "canary-output/retrieved-bedtools-${{ matrix.arch }}.sif" \
            --workspace canary-output/retrieved-work \
            --output canary-output/retrieved-runtime.json

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bedtools-immutable-canary-${{ matrix.arch }}
          path: canary-output
          if-no-files-found: error
          retention-days: 30

  summarize:
    if: ${{ always() }}
    needs: build-verify-publish-retrieve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require both contained architecture jobs to pass
        env:
          RESULT: ${{ needs.build-verify-publish-retrieve.result }}
        run: test "$RESULT" = success
