name: Contract native canary validation (no publication)

on:
  workflow_dispatch:
    inputs:
      authorize_native_validation:
        description: "Separate approval to build and validate exactly seven tools; never publish"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: contract-native-canary-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selection:
    if: ${{ inputs.authorize_native_validation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        name: Freeze exact contracts, fixtures, source SHA and fourteen native pairs
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -m scripts.contract_native_validation plan \
            --source-commit "$SOURCE_SHA" \
            --plan "$RUNNER_TEMP/validation-plan.json" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: contract-native-validation-plan
          path: ${{ runner.temp }}/validation-plan.json
          if-no-files-found: error
          retention-days: 30

  native-validation:
    needs: selection
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.selection.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: contract-native-validation-plan
          path: ${{ runner.temp }}/native-plan
      - uses: docker/setup-buildx-action@v3
      - name: Install native SIF validation tooling only
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          apptainer --version
      - name: Native OCI and SIF validation; no registry writes
        env:
          TOOL: ${{ matrix.tool_id }}
          ARCH: ${{ matrix.arch }}
          PLAN_SHA: ${{ needs.selection.outputs.plan_sha256 }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          set -euo pipefail
          python3 -m scripts.contract_native_validation execute \
            --plan "$RUNNER_TEMP/native-plan/validation-plan.json" \
            --plan-sha256 "$PLAN_SHA" --tool "$TOOL" --arch "$ARCH" \
            --output "$RUNNER_TEMP/native-evidence" \
            --authorize-native-execution
      - name: Retain terminal evidence even on failure (no OCI/SIF publication)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: contract-native-evidence-${{ matrix.tool_id }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/native-evidence/**
            !${{ runner.temp }}/native-evidence/oci-image.tar
            !${{ runner.temp }}/native-evidence/validated.sif
          if-no-files-found: error
          retention-days: 30

      - name: Retain successful SIF candidate for later separately gated release
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: contract-native-payload-${{ matrix.tool_id }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/native-evidence/validated.sif
            ${{ runner.temp }}/native-evidence/entry.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  reconcile:
    if: ${{ always() }}
    needs: [selection, native-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: contract-native-validation-plan
          path: ${{ runner.temp }}/native-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: contract-native-evidence-*
          path: ${{ runner.temp }}/native-results
      - name: Require fourteen complete unique terminal records and every gate
        env:
          PLAN_SHA: ${{ needs.selection.outputs.plan_sha256 }}
          SELECTION_RESULT: ${{ needs.selection.result }}
          NATIVE_RESULT: ${{ needs.native-validation.result }}
        run: |
          set -euo pipefail
          python3 -m scripts.contract_native_validation reconcile \
            --plan "$RUNNER_TEMP/native-plan/validation-plan.json" \
            --plan-sha256 "$PLAN_SHA" --records "$RUNNER_TEMP/native-results" \
            --output "$RUNNER_TEMP/native-summary.json"
          test "$SELECTION_RESULT" = success
          test "$NATIVE_RESULT" = success
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: contract-native-validation-summary
          path: ${{ runner.temp }}/native-summary.json
          if-no-files-found: error
          retention-days: 30
