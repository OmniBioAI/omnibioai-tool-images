[pytest]
testpaths = tests
addopts = -v --tb=short --cov=api --cov=scripts --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=98
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    docker: tests involving Docker builds
    sif: tests involving Singularity images
